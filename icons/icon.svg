  <circle cx="48.5" cy="42.5" r="4" fill="#FFC93C" stroke="#1A1423" stroke-width="1.5"/>
  <!-- Original chrome starburst ornament -->
  <path d="M32 31.5 L33.2 34 L35.8 34.4 L33.9 36 L34.4 38.6 L32 37.3 L29.6 38.6 L30.1 36 L28.2 34.4 L30.8 34 Z" fill="#E3E7ED" stroke="#1A1423" stroke-width="0.8"/>
